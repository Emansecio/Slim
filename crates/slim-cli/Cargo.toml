[package]
name = "slim-cli"
version = "0.1.0"
edition = "2021"
license.workspace = true
autobins = false

[lints]
workspace = true

[dependencies]
base64 = "0.22"
directories = "5"
getrandom = "0.3"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slim-core = { path = "../slim-core" }
slim-lsp = { path = "../slim-lsp" }
slim-tui = { path = "../slim-tui" }
tokio = { workspace = true }
windows-sys = { workspace = true }

[[test]]
name = "smoke_workspace"
path = "../../tests/smoke_workspace.rs"

[[test]]
name = "e2e_v1"
path = "../../tests/e2e_v1.rs"

[[test]]
name = "e2e_offline"
path = "../../tests/e2e_offline.rs"

[[bin]]
name = "slim"
path = "src/main.rs"

[dev-dependencies]
crossterm = "0.28"
portable-pty = { workspace = true }
proptest = { workspace = true }
