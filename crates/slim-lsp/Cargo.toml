[package]
name = "slim-lsp"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slim-core = { path = "../slim-core" }
url = "2"
tokio = { workspace = true }

[[bin]]
name = "slim-lsp-mock"
path = "src/bin/mock_lsp.rs"
test = false
bench = false
doc = false

# Unused here; keeps `-p slim-lsp` on the workspace feature set (see root Cargo.toml).
[dev-dependencies]
portable-pty = { workspace = true }
proptest = { workspace = true }
