[package]
name = "slim-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ignore = "0.4"
async-trait = "0.1"
futures-util = "0.3"
httpdate = "1.0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading"] }

[[bench]]
name = "tool_setup"
harness = false

[[bench]]
name = "compaction_selector"
harness = false
